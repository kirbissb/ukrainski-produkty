_ru":"","desc_uk":"","desc_en":""}],"delivery":[{"id":"pickup","price":0,"demo":true},{"id":"alanya","price":100,"free_from":1500,"demo":true},{"id":"cargo","price":250,"free_from":3000,"demo":true}],"payment":[{"id":"card","demo":true},{"id":"cash","demo":true}],"rules":{"min_order":500},"reviews":[{"img":"img/reviews/review-01-salo-ukr.jpg","text":null,"name":"Viktoriia"},{"img":"img/reviews/review-02-salo-idealne.jpg","text":null,"name":"Анжелика"},{"img":"img/reviews/review-03-sardelky-kovbasa.jpg","text":null,"name":"Artem H."},{"img":"img/reviews/review-04-doktorska-salo-vyshnia.jpg","text":null,"name":"yuriy_boss"},{"img":"img/reviews/review-05-ikra-ryba-miaso.jpg","text":null,"name":"Таня К."},{"img":"img/reviews/review-06-ikra-chorna-chervona.jpg","text":null,"name":"Диана"},{"img":"img/reviews/review-07-ikra-chervona-foto.jpg","text":null,"name":"Юлия"},{"img":"img/reviews/review-08-osetryna-ikra.jpg","text":null,"name":"Александр В."},{"img":"img/reviews/review-09-tort-balyk.jpg","text":null,"name":"marie_l_kececi"},{"img":"img/reviews/review-10-ikra-dostavka-speka.jpg","text":null,"name":"Mila"},{"img":"img/reviews/review-11-posylka-idealno.jpg","text":null,"name":"Элиф"},{"img":"img/reviews/review-12-rebra-hryl.jpg","text":null,"name":""},{"img":null,"name":"Santa","text":"Добрый вечер 🌆\nНе устану благодарить Марго и ее прекрасного отца за доставку такого прекрасного, невероятно свежего, аппетитного украинского сала 💪🏼\nОтдельная благодарность за вкуснейшие сардельки и докторскую колбасу, Вы лучшие!!!\n🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥"}]}/*CAT_END*/;

<script src="assets/engine.js"></script>
<script>
(function () {
  'use strict';
  var E = window.Engine;
  var C = E.applyOverrides(E.parseCatalog(CATALOG_RAW));
  E.seedOrders();
  var chat = document.getElementById('chat');
  var pending = null; /* a "Верно?" question waiting for Да/Нет typed instead of tapped */

  function now() { var d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
  function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
  function bubble(html, dir, buttons, extra) {
    var m = document.createElement('div'); m.className = 'msg ' + (dir || 'in') + (extra ? ' ' + extra : '');
    var b = document.createElement('div'); b.className = 'bub'; b.innerHTML = html + '<span class="t">' + now() + '</span>';
    m.appendChild(b);
    if (buttons && buttons.length) {
      var kb = document.createElement('div'); kb.className = 'kb';
      buttons.forEach(function (bt) {
        var x = document.createElement('button'); x.type = 'button'; x.textContent = bt.label;
        x.addEventListener('click', function () {
          Array.prototype.forEach.call(kb.children, function (c) { c.disabled = true; });
          x.classList.add('done'); bt.run();
        });
        kb.appendChild(x);
      });
      m.appendChild(kb);
    }
    chat.appendChild(m); chat.scrollTop = chat.scrollHeight;
    return m;
  }
  function say(html, buttons) { return bubble(html, 'in', buttons); }
  function me(text) { return bubble(esc(text), 'out'); }
  function customer(who, html) { return bubble('<span class="who">' + esc(who) + '</span>' + html, 'in', null, 'cust'); }
  function notifyParent(msg) { try { if (window.parent !== window) window.parent.postMessage(msg, '*'); } catch (e) { /* ignore */ } }
  function refreshCatalog() { C = E.applyOverrides(E.parseCatalog(CATALOG_RAW)); notifyParent('ukr-demo:changed'); }
  function money(n) { return '<span class="g">' + E.fmtMoney(n) + '</span>'; }
  function nameOf(it) { return esc(it.name_ru); }
  var STATUS = { 'new': 'новый', confirmed: 'подтверждён', paid: 'оплачен', shipped: 'отправлен', oos: 'нет в наличии' };
  var DAY_RU = { mon: 'понедельник', tue: 'вторник', wed: 'среда', thu: 'четверг', fri: 'пятница', sat: 'суббота', sun: 'воскресенье' };
  function dayRu(d) { return d ? (DAY_RU[d] || d) : ''; }
  function plural(n, a, b, c) { var m10 = n % 10, m100 = n % 100; if (m10 === 1 && m100 !== 11) return a; if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return b; return c; }
  function ask(html, yes) {
    pending = { yes: yes };
    say(html, [{ label: 'Да', run: function () { pending = null; yes(); } }, { label: 'Нет', run: function () { pending = null; say('Отменено.'); } }]);
  }

  /* ---------- job 1: orders ---------- */
  function orderCard(o) {
    var line = esc(E.orderShortLine(o));
    var extra = o.comment ? '\nКомментарий: ' + esc(o.comment) : '';
    if (o.date) extra += '\nЖелаемая дата: ' + esc(o.date.split('-').reverse().join('.'));
    var buttons = o.status === 'new' ? [
      { label: 'Подтвердить', run: function () { confirmOrder(o.no); } },
      { label: 'Нет в наличии', run: function () { askOos(o.no); } },
      { label: 'Позвонить', run: function () { say('Клиент: ' + esc(o.customer.name) + ', ' + esc(o.customer.phone)); } }
    ] : [];
    return say('<b>' + line.replace(/^(Заказ №\d+):/, '<span class="g">$1</span>:') + '</b>' + extra, buttons);
  }
  function confirmOrder(no) {
    var o = E.updateOrder(no, { status: 'confirmed' });
    if (!o) return say('Не нашёл заказ ' + E.orderNo(no) + '.');
    say('Клиенту отправлено подтверждение: ' + E.orderNo(o.no) + ', ' + E.fmtPair(o.subtotal, o.usd) + (o.deliveryPrice ? ' + доставка ' + E.fmtMoney(o.deliveryPrice) : ', доставка бесплатно') + '. После взвешивания напишите, например: <b>' + o.no + ' ' + esc(o.lines[0].name.split(' ')[0].toLowerCase()) + ' 0,54</b>');
  }
  function askOos(no) {
    var o = E.findOrder(no); if (!o) return;
    say('Чего нет в ' + E.orderNo(no) + '?', o.lines.map(function (l) {
      return { label: l.name, run: function () {
        E.updateOrder(no, { status: 'oos', oosItem: l.name });
        var it = C.byId[l.id];
        if (it && E.itemState(it) !== 'sold_out') { E.setState(l.id, { state: 'sold_out' }); refreshCatalog(); }
        say('Клиенту отправлено: «' + esc(l.name) + '» сейчас нет, предложили заменить или подождать до поставки. Заказ ' + E.orderNo(no) + ' на паузе. На сайте у позиции плашка «Закончилось».');
      } };
    }));
  }
  function weigh(cmd) {
    var o = E.findOrder(cmd.no);
    if (!o) return say('Не нашёл заказ ' + E.orderNo(cmd.no) + '.');
    var line = E.findItem(cmd.query, o.lines.map(function (l) { return { id: l.id, name_ru: l.name, keys: [] }; }));
    if (!line) return say('В ' + E.orderNo(o.no) + ' нет позиции «' + esc(cmd.query) + '». Есть: ' + o.lines.map(function (l) { return esc(l.name.toLowerCase()); }).join(', ') + '.');
    var it = C.byId[line.id];
    var qty = it.unit === 'pc' ? Math.round(cmd.kg) : Math.round(cmd.kg * 1000);
    o.lines.forEach(function (l) { if (l.id === line.id) l.qty = qty; });
    E.recalcOrder(o, C);
    E.updateOrder(o.no, { lines: o.lines, subtotal: o.subtotal, deliveryPrice: o.deliveryPrice, total: o.total, status: o.status === 'new' ? 'confirmed' : o.status });
    var l2 = o.lines.filter(function (l) { return l.id === line.id; })[0];
    say(E.orderNo(o.no) + ': ' + esc(l2.name.toLowerCase()) + ' ' + esc(l2.weight) + ' = <span class="g">' + E.fmtMoney(l2.sum, l2.cur) + '</span>. Итого <span class="g">' + E.fmtPair(o.subtotal, o.usd) + '</span>' + (o.deliveryPrice ? ' + доставка ' + E.fmtMoney(o.deliveryPrice) + ' = ' + E.fmtPair(o.total, o.usd) : '') + '.\nКлиенту отправлено: сумма ' + E.fmtPair(o.subtotal, o.usd) + (o.payment === 'card' ? ', номер карты' : '') + '.');
  }
  function today() {
    var pl = E.pickList(E.loadOrders(), C);
    if (!pl.count) return say('На сегодня открытых заказов нет.');
    var items = pl.items.map(function (i) { return esc(i.name.toLowerCase()) + ' <b>' + esc(i.label) + '</b>'; }).join(', ');
    say('<b>На сегодня: ' + pl.count + ' ' + plural(pl.count, 'заказ', 'заказа', 'заказов') + '.</b>\nСобрать: ' + items + '.\nОтправка: карго ' + (pl.shipping.cargo || 0) + ' / Алания ' + (pl.shipping.alanya || 0) + ' / самовывоз ' + (pl.shipping.pickup || 0) + '.');
    var open = E.loadOrders().filter(function (o) { return o.status === 'new' || o.status === 'confirmed' || o.status === 'paid'; });
    say(open.map(function (o) { return E.orderNo(o.no) + ' · ' + esc(o.customer.name) + ', ' + esc(o.customer.city) + ' · ' + STATUS[o.status]; }).join('\n'));
  }
  function week() {
    var r = E.weekReport(E.loadOrders());
    say('<b>За неделю:</b> ' + r.count + ' ' + plural(r.count, 'заказ', 'заказа', 'заказов') + ' на <span class="g">' + E.fmtPair(r.sum, r.usd) + '</span>.\nТоп-3: ' + r.top.map(function (t) { return esc(t.name.toLowerCase()) + ' ' + E.fmtMoney(t.sum, t.cur); }).join(', ') + '.\nПовторных клиентов: ' + r.repeat + '.');
  }

  /* ---------- job 2: delivery requests ---------- */
  function money0(n) { return E.fmtMoney(n); }
  function deliveryAnswer(city, fromCustomer) {
    var r = E.deliveryRule(city, C);
    var c = C.deliveryById.cargo;
    var head = fromCustomer ? 'Отвечаю клиенту сам. ' : '';
    if (r.mode === 'courier') {
      return say(head + '<b>' + esc(r.city) + '</b>: это Алания и район. Курьер ' + money0(r.price) + ', бесплатно от ' + money0(r.freeFrom) + ', сегодня или завтра; самовывоз бесплатно. Клиенту отправлено, в заказ запишу курьером.');
    }
    if (r.mode === 'courier-own') {
      return say(head + '<b>' + esc(r.city) + '</b>: по моей памяти вы ездите сами' + (r.day ? ' (' + esc(dayRu(r.day)) + ')' : '') + '. Клиенту отправлено: привезём' + (r.day ? ' в ' + esc(dayRu(r.day)) : '') + ' или карго ' + money0(r.price) + '. В заказ запишу выездом.');
    }
    if (r.mode === 'ask') {
      say(head + '<b>' + esc(r.city) + '</b>: карго я знаю - ' + money0(r.price) + ', бесплатно от ' + money0(r.freeFrom) + ', 2-3 дня. Клиенту пока ответил: «Уточню, отвечу в течение часа».');
      return say('Марго, одного не знаю: вы сами ездите в ' + esc(r.city) + '?', [
        { label: 'Да, по четвергам', run: function () { E.learnDelivery(r.city, { courier: true, day: 'thu' }); say('Запомнил: ' + esc(r.city) + ' - выезд по четвергам. Клиенту отправлено: привезём в четверг или карго ' + money0(r.price) + '. В следующий раз отвечу сам.'); } },
        { label: 'Да, любой день', run: function () { E.learnDelivery(r.city, { courier: true, day: null }); say('Запомнил: ' + esc(r.city) + ' - выезд в любой день. Клиенту отправлено. В следующий раз отвечу сам.'); } },
        { label: 'Нет, только карго', run: function () { E.learnDelivery(r.city, { courier: false }); say('Запомнил: ' + esc(r.city) + ' - только карго ' + money0(r.price) + '. Клиенту отправлено. В следующий раз отвечу сам.'); } }
      ]);
    }
    return say(head + '<b>' + esc(r.city) + '</b>: карго ' + money0(r.price) + ' (бесплатно от ' + money0(r.freeFrom) + '), 2-3 дня, трек-номер пришлю в Telegram. Клиенту отправлено, в заказ запишу карго. Вас не беспокоил: правило известно.');
  }
  function customerAsk(city, who, text) {
    customer(who, esc(text));
    setTimeout(function () { deliveryAnswer(city, true); }, 350);
  }

  /* ---------- job 3: site updates from chat ---------- */
  function noItem(q) { say('Не нашёл такой товар: «' + esc(q) + '». Напишите название как в каталоге.'); }
  function stateCmd(cmd) {
    var it = E.findItem(cmd.query, C.items);
    if (!it) return noItem(cmd.query);
    var cur = E.itemState(it), n = nameOf(it), s = cmd.state;
    if (s === 'sold_out') return ask('<b>' + n + '</b>: на сайте будет плашка «Закончилось ⛔️», кнопки «Сообщить о поставке» и «Заказать к следующей поставке» (идёт в заказ «под заказ»). Верно?', function () { E.setState(it.id, { state: 'sold_out' }); refreshCatalog(); say('Готово. «' + n + '»: закончилось. Спасибо за день.'); });
    if (s === 'few_left') return ask('<b>' + n + '</b>: плашка «Осталось мало»' + (cmd.qty ? ', на карточке ~' + String(cmd.qty).replace('.', ',') + ' кг' : '') + '. Верно?', function () { E.setState(it.id, { state: 'few_left', qty: cmd.qty }); refreshCatalog(); say('Готово. «' + n + '»: осталось мало' + (cmd.qty ? ' (~' + String(cmd.qty).replace('.', ',') + ' кг)' : '') + '.'); });
    if (s === 'not_now') return ask('<b>' + n + '</b>: пометить «Пока нет» (серая карточка, без кнопки, не в общей ленте). Верно?', function () { E.setState(it.id, { state: 'not_now' }); refreshCatalog(); say('Готово. «' + n + '»: пока нет.'); });
    if (s === 'preorder') return ask('<b>' + n + '</b>: «Принимаю заказы»' + (cmd.day ? ', день: ' + esc(dayRu(cmd.day)) : '') + '. Заказы идут в корзину как «под заказ». Верно?', function () { E.setState(it.id, { state: 'preorder', day: cmd.day }); refreshCatalog(); say('Готово. «' + n + '»: принимаю заказы' + (cmd.day ? ', день: ' + esc(dayRu(cmd.day)) : '') + '.'); });
    /* in_stock / new_batch: back from sold out or not yet = new batch (first in the list for 48 h; no stamp on the card since 09.10) */
    var fresh = s === 'new_batch' || cur === 'sold_out' || cur === 'not_now' || cur === 'preorder';
    return ask('<b>' + n + '</b>: ' + (fresh ? 'в наличии, карточка на 48 часов выходит в начало списка' : 'в наличии') + '. Верно?', function () {
      E.setState(it.id, { state: fresh ? 'new_batch' : 'in_stock' }); refreshCatalog();
      say('Готово. «' + n + '»: в наличии' + (fresh ? ', первой в списке' : '') + '.');
      if (fresh) say('Разослать клиентам, кто ждал «' + n + '»?', [
        { label: 'Да, разослать', run: function () { var k = E.loadNotify().filter(function (x) { return x.item === it.id; }).length; say('Отправлено: ' + k + ' ' + plural(k, 'клиенту', 'клиентам', 'клиентам') + ' из «Сообщить о поставке» и 2 135 участникам группы: «Новая поставка 🔥 ' + n.toLowerCase() + '».'); } },
        { label: 'Не сейчас', run: function () { say('Хорошо, не рассылаю.'); } }
      ]);
    });
  }
  function nextBatchCmd(cmd) {
    var out = C.items.filter(function (it) { return E.itemState(it) === 'sold_out'; });
    if (!out.length) return say('Сейчас ничего не закончилось, день ставить некуда. Когда что-то закончится, напишите ещё раз.');
    ask('Следующая поставка: <b>' + esc(dayRu(cmd.day)) + '</b>. Появится на ' + out.length + ' ' + plural(out.length, 'карточке', 'карточках', 'карточках') + ' закончившихся товаров: ' + out.slice(0, 4).map(function (i) { return esc(i.name_ru.toLowerCase()); }).join(', ') + (out.length > 4 ? ' и ещё ' + (out.length - 4) : '') + '. Верно?', function () {
      var n = E.setNextBatch(cmd.day, C); refreshCatalog();
      say('Готово. День «' + esc(dayRu(cmd.day)) + '» стоит на ' + n + ' карточках; в ответе «Когда новая поставка?» на сайте тоже.');
    });
  }
  function price(cmd) {
    var it = E.findItem(cmd.query, C.items);
    if (!it) return noItem(cmd.query);
    ask('<b>' + nameOf(it) + '</b>: ' + E.fmtMoney(it.price, it.currency) + E.unitLabel(it, 'ru') + ' → <span class="g">' + E.fmtMoney(cmd.price, it.currency) + '</span>' + E.unitLabel(it, 'ru') + '. Верно?', function () { E.setPrice(it.id, cmd.price); refreshCatalog(); say('Готово. Цена на сайте: ' + nameOf(it) + ' ' + E.fmtMoney(cmd.price, it.currency) + E.unitLabel(it, 'ru') + '.'); });
  }
  function forwardPhoto(caption) {
    var cap = caption || 'бастурма 850';
    bubble('<img class="pic" src="img/forward-basturma.jpg" alt="">' + esc(cap), 'out');
    setTimeout(function () {
      var p = E.parseNewItem(cap);
      if (!p) return say('Фото получил, но в подписи не вижу цены. Перешлите ещё раз с подписью «название цена», например: <b>бастурма 850</b>.');
      ask('Новая позиция: <b>' + esc(p.name) + '</b>, ' + money(p.price) + '/кг, фото получено. На сайте: первой в списке, категория «Другое», веса 300 г / 500 г / 1 кг. Верно?', function () {
        var id = 'new-' + Date.now().toString(36);
        E.addNewItem({ id: id, cat: 'inshe', name_ru: p.name, name_uk: p.name, name_en: p.name, desc_ru: '', desc_uk: '', desc_en: '', unit: 'kg', price: p.price, currency: 'TRY', steps_g: [300, 500, 1000], min_g: 300, pack_g: null, demo: false,
          photo: 'img/forward-basturma.jpg', keys: [p.name.toLowerCase()], state: 'new_batch', since: Date.now() });
        refreshCatalog();
        say('Готово. «' + esc(p.name) + '» на сайте: ' + E.fmtMoney(p.price) + '/кг, первой в списке. Название на украинском и английском оставил как есть; поправить - напишите.');
      });
    }, 350);
  }
  function broadcast() {
    var fresh = C.items.filter(function (i) { var s = E.itemState(i); return s === 'new_batch'; }).slice(0, 4).map(function (i) { return i.name_ru.toLowerCase(); });
    var have = fresh.length ? fresh : C.items.filter(function (i) { return E.itemState(i) === 'in_stock'; }).slice(0, 4).map(function (i) { return i.name_ru.toLowerCase(); });
    say('Черновик рассылки:\n«Новая поставка 🔥 ' + esc(have.join(', ')) + '. Заказывайте на сайте: Алания сегодня, Турция карго 2-3 дня.»', [
      { label: 'Отправить всем', run: function () { say('Отправлено 2 135 участникам группы и подписчикам сайта, которые согласились на сообщения.'); } },
      { label: 'Изменить текст', run: function () { say('Напишите новый текст, и я отправлю его на подтверждение.'); } }
    ]);
  }
  function stampsOverlay() {
    say('Плашки в ваших словах: «Закончилось», «Осталось мало», «Новая поставка», «Принимаю заказы», «В наличии», на русском, украинском и английском. Открываю.');
    var o = document.getElementById('sovl'); document.getElementById('sframe').src = 'stamps.html?t=' + Date.now();
    o.classList.add('on'); o.setAttribute('aria-hidden', 'false');
  }
  function closeStamps() { var o = document.getElementById('sovl'); o.classList.remove('on'); o.setAttribute('aria-hidden', 'true'); document.getElementById('sframe').src = 'about:blank'; }
  document.getElementById('sclose').addEventListener('click', closeStamps);
  window.addEventListener('message', function (e) { if (e.source === document.getElementById('sframe').contentWindow && e.data === 'ukr-demo:close-stamps') closeStamps(); });

  /* ---------- router ---------- */
  function help() {
    say('Не понял. Примеры:\n<b>103 сало 0,54</b> взвесили, пересчитать\n<b>сало закончилось</b> / <b>сало есть</b> / <b>сало мало 2 кг</b>\n<b>зельц на воскресенье</b> / <b>следующая поставка четверг</b>\n<b>доставка в Белек?</b> / <b>Докторская 1150</b>\n<b>Сегодня</b>, <b>Неделя</b>, <b>плашки</b>, <b>Завоз</b>');
  }
  function handle(text) {
    var cmd = E.parseBotCommand(text);
    if (pending && /^(да|так|нет|ні)$/i.test(text.trim())) { var p = pending; pending = null; if (/^(да|так)$/i.test(text.trim())) p.yes(); else say('Отменено.'); return; }
    pending = null;
    switch (cmd.type) {
      case 'confirm': return confirmOrder(cmd.no);
      case 'weight': return weigh(cmd);
      case 'paid': { var o = E.updateOrder(cmd.no, { status: 'paid' }); if (!o) return say('Не нашёл заказ ' + E.orderNo(cmd.no) + '.'); return say(E.orderNo(o.no) + ': оплачен. Клиенту отправлено: «получили, собираем».'); }
      case 'shipped': { var s = E.updateOrder(cmd.no, { status: 'shipped', track: cmd.track }); if (!s) return say('Не нашёл заказ ' + E.orderNo(cmd.no) + '.'); return say(E.orderNo(s.no) + ': отправлен' + (cmd.track ? ', трек <b>' + esc(cmd.track) + '</b>' : '') + '. Клиенту отправлено: трек и срок (' + (s.delivery === 'cargo' ? '2-3 дня' : 'сегодня или завтра') + ').'); }
      case 'today': return today();
      case 'week': return week();
      case 'broadcast': return broadcast();
      case 'stamps': return stampsOverlay();
      case 'delivery': return deliveryAnswer(cmd.city, false);
      case 'state': return stateCmd(cmd);
      case 'nextbatch': return nextBatchCmd(cmd);
      case 'price': return price(cmd);
      default: return help();
    }
  }

  /* ---------- UI ---------- */
  var QUICK = [
    { label: 'Сегодня', text: 'Сегодня' }, { label: '103 сало 0,54', text: '103 сало 0,54' }, { label: '103 оплачено', text: '103 оплачено' },
    { label: '103 отправлено 1234567890', text: '103 отправлено 1234567890' },
    { label: 'сало закончилось', text: 'сало закончилось' }, { label: 'новая поставка сало', text: 'новая поставка сало' }, { label: 'сало мало 2 кг', text: 'сало мало 2 кг' },
    { label: 'зельц на воскресенье', text: 'зельц на воскресенье' }, { label: 'следующая поставка четверг', text: 'следующая поставка четверг' },
    { label: 'Клиент: доставка в Белек?', cust: ['Белек', 'Марина', 'Добрый день! Можна замовити сало і ковбасу, і чи можна доставку в Белек?'] },
    { label: 'Клиент: доставка в Стамбул?', cust: ['Стамбул', 'Игорь', 'А в Стамбул доставляете?'] },
    { label: 'плашки', text: 'плашки' }, { label: 'Докторская 1150', text: 'Докторская 1150' }, { label: 'Завоз', text: 'Завоз' }, { label: 'Неделя', text: 'Неделя' },
    { label: 'Фото + «бастурма 850»', photo: true }
  ];
  var quick = document.getElementById('quick');
  QUICK.forEach(function (q) {
    var b = document.createElement('button'); b.type = 'button'; b.textContent = q.label;
    b.addEventListener('click', function () { if (q.cust) customerAsk(q.cust[0], q.cust[1], q.cust[2]); else if (q.photo) forwardPhoto(''); else send(q.text); });
    quick.appendChild(b);
  });
  var inp = document.getElementById('inp');
  document.getElementById('compose').addEventListener('submit', function (e) { e.preventDefault(); var v = inp.value.trim(); if (!v) return; inp.value = ''; send(v); });
  document.getElementById('attach').addEventListener('click', function () { var v = inp.value.trim(); inp.value = ''; forwardPhoto(v); });
  function send(text) { me(text); setTimeout(function () { handle(text); }, 250); }
  document.getElementById('reset').addEventListener('click', function () {
    try { [E.KEYS.orders, E.KEYS.ordersOld, 'ukr-demo-stock', 'ukr-demo-prices', 'ukr-demo-newitems', 'ukr-demo-delivery', 'ukr-demo-notify'].forEach(function (k) { localStorage.removeItem(k); }); } catch (e) { /* ignore */ }
    E.seedOrders(); refreshCatalog(); chat.innerHTML = ''; pending = null; open();
  });

  function open() {
    var orders = E.loadOrders();
    var day = document.createElement('div'); day.className = 'day'; day.textContent = 'сегодня'; chat.appendChild(day);
    var fresh = orders.filter(function (o) { return o.status === 'new'; });
    if (fresh.length) { say('Новых заказов: <b>' + fresh.length + '</b>. Одно нажатие, и клиент получает подтверждение.'); fresh.forEach(orderCard); }
    else say('Новых заказов нет. Напишите <b>Сегодня</b>, чтобы увидеть, что собирать.');
    var waiting = E.loadNotify();
    if (waiting.length) say('Ждут поставку: ' + waiting.length + ' ' + plural(waiting.length, 'клиент', 'клиента', 'клиентов') + ' (кнопка «Сообщить о поставке» на сайте). Когда напишете «новая поставка ...», я предложу им разослать.');
  }
  open();
  window.__bot = { send: send, handle: handle, customerAsk: customerAsk, forwardPhoto: forwardPhoto };
})();
</script>
</body>
